<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }} | {{ site.title }}</title>
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
  </head>
  <body>
    <div class="wrapper">
      <header>
        {% if site.logo %}
          <img src="{{ site.logo | relative_url }}" alt="{{ site.title }}" style="width:100%;margin-bottom:15px;"/>
        {% endif %}
 
        <h1><a href="{{ "/" | relative_url }}">{{ site.title }}</a></h1>
 
        {% if site.description %}
          <p>{{ site.description }}</p>
        {% endif %}
 
        <hr>
 
        <nav>
          <p>
            <a href="https://www.linkedin.com/in/nitya-lagadapati/" target="_blank">LinkedIn</a><br>
            <a href="/assets/pdfs/Resume_Nitya_Lagadapati.pdf" target="_blank">Resume</a><br>
            <a href="/assets/pdfs/CV_Nitya_Lagadapati.pdf" target="_blank">CV</a><br>
            <a href="https://github.com/Nitya-l" target="_blank">GitHub</a>
          </p>
        </nav>
 
      </header>
 
      <section>
        {{ content }}
      </section>
 
    </div>
  </body>
</html>
